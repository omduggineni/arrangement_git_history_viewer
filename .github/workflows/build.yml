# Builds the cross_platform app for macOS, Windows, and Linux, and the SwiftUI app for macOS.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cross-platform-macos:
    defaults:
      run:
        working-directory: cross_platform
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[build]"
          .venv/bin/python -m PyInstaller packaging/arrangement_diff_viewer.spec --noconfirm --clean
      - uses: actions/upload-artifact@v4
        with:
          name: arrangement-diff-viewer-cross-platform-macos
          path: cross_platform/dist/Arrangement Diff Viewer.app
          retention-days: 7

  cross-platform-windows:
    defaults:
      run:
        working-directory: cross_platform
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -e ".[build]"
          .venv\Scripts\python -m PyInstaller packaging/arrangement_diff_viewer.spec --noconfirm --clean
      # Wrap the exe + _internal folder into a single Setup.exe.
      - shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=0.1.0 packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: arrangement-diff-viewer-cross-platform-windows-installer
          path: cross_platform/dist/installer/Arrangement-Diff-Viewer-Setup.exe
          retention-days: 7

  cross-platform-linux:
    defaults:
      run:
        working-directory: cross_platform
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # python3-gi/webkit2gtk are pywebview's GTK backend on Linux;
      # appimagetool needs curl/file.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config gcc python3-dev \
            curl file libfuse2
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[build]"
          .venv/bin/python -m PyInstaller packaging/arrangement_diff_viewer.spec --noconfirm --clean
          bash packaging/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arrangement-diff-viewer-cross-platform-linux
          path: cross_platform/dist/Arrangement-Diff-Viewer.AppImage
          retention-days: 7

  swiftui-macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: swiftui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Freezes the Python diff sidecar, builds the release binary, and bundles the ad-hoc signed .app.
      - run: make app PYTHON3=python3
      # upload-artifact drops the executable bit, so ship a zip.
      - run: ditto -c -k --keepParent "dist/Arrangement Diff Viewer.app" dist/Arrangement-Diff-Viewer-swiftui-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: arrangement-diff-viewer-swiftui-macos
          path: swiftui/dist/Arrangement-Diff-Viewer-swiftui-macos.zip
          retention-days: 7
