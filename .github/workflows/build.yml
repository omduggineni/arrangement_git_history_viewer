# Builds the native app for macOS, Windows, and Linux.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[build]"
          .venv/bin/python -m PyInstaller packaging/arrangement_diff_viewer.spec --noconfirm --clean
      - uses: actions/upload-artifact@v4
        with:
          name: arrangement-diff-viewer-macos
          path: dist/Arrangement Diff Viewer.app
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -e ".[build]"
          .venv\Scripts\python -m PyInstaller packaging/arrangement_diff_viewer.spec --noconfirm --clean
      - uses: actions/upload-artifact@v4
        with:
          name: arrangement-diff-viewer-windows
          path: dist/Arrangement Diff Viewer/
          retention-days: 7

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # python3-gi/webkit2gtk are pywebview's GTK backend on Linux;
      # appimagetool needs curl/file.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config gcc python3-dev \
            curl file libfuse2
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[build]"
          .venv/bin/python -m PyInstaller packaging/arrangement_diff_viewer.spec --noconfirm --clean
          bash packaging/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arrangement-diff-viewer-linux
          path: dist/Arrangement-Diff-Viewer.AppImage
          retention-days: 7
