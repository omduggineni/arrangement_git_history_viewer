# Builds the native app for macOS, Windows, and Linux using GitLab.com's
# SaaS runners. macOS and Windows runners require a GitLab.com plan with
# paid SaaS runner minutes (Premium/Ultimate, or a minutes pack).
stages:
  - build

build:macos:
  stage: build
  tags:
    - saas-macos-medium-m1
  image: macos-14-xcode-15
  script:
    - python3 -m venv .venv
    - .venv/bin/pip install --upgrade pip
    - .venv/bin/pip install -e ".[build]"
    - .venv/bin/python -m PyInstaller packaging/arrangement_diff_viewer.spec --noconfirm --clean
  artifacts:
    name: "arrangement-diff-viewer-macos"
    paths:
      - "dist/Arrangement Diff Viewer.app"
    expire_in: 1 week

build:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  before_script:
    - Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
    - choco install python312 -y --no-progress
    - refreshenv
  script:
    - python -m venv .venv
    - .venv\Scripts\pip install --upgrade pip
    - .venv\Scripts\pip install -e ".[build]"
    - .venv\Scripts\python -m PyInstaller packaging/arrangement_diff_viewer.spec --noconfirm --clean
  artifacts:
    name: "arrangement-diff-viewer-windows"
    paths:
      - "dist/Arrangement Diff Viewer/"
    expire_in: 1 week

build:linux:
  stage: build
  image: python:3.11-bookworm
  script:
    # python3-gi/webkit2gtk are pywebview's GTK backend on Linux;
    # appimagetool needs FUSE-less extraction support (handled in the script) plus curl/file.
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1
        libgirepository1.0-dev libcairo2-dev pkg-config gcc python3-dev
        curl file
    - python -m venv .venv
    - .venv/bin/pip install --upgrade pip
    - .venv/bin/pip install -e ".[build]"
    - .venv/bin/python -m PyInstaller packaging/arrangement_diff_viewer.spec --noconfirm --clean
    - bash packaging/build_appimage.sh
  artifacts:
    name: "arrangement-diff-viewer-linux"
    paths:
      - "dist/Arrangement-Diff-Viewer.AppImage"
    expire_in: 1 week
