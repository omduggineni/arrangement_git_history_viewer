[project]
name = "arrangement-diff-viewer"
version = "0.1.0"
description = "Web GUI for viewing git history and diffs of MuseScore (.mscz) score files, using musicdiff."
requires-python = ">=3.11"
dependencies = [
    "nicegui>=1.4",
    "musicdiff>=6.0",
    "music21>=9.1",
    "pygit2>=1.14",
    "verovio>=4.3",
    "pywebview>=5.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
arrangement-diff-viewer = "app.main:run_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
